[project]
name = "proof3d-pipeline"
version = "0.1.0"
description = "Stage interfaces, configs and typed inputs/outputs for the Proof3D pipeline."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "psutil>=6.0",  # stage memory measurement
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proof3d_pipeline"]
