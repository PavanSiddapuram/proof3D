[project]
name = "proof3d-worker-cpu"
version = "0.1.0"
description = "CPU stages: mesh checks, repair rungs 1-2, optimisation, packaging, publishing."
requires-python = ">=3.12,<3.13"
dependencies = [
    "proof3d-pipeline",
    "proof3d-geometry",
    "proof3d-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proof3d_worker_cpu"]
