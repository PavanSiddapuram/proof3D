[project]
name = "proof3d-api"
version = "0.1.0"
description = "FastAPI orchestrator: jobs, stages, Postgres-backed queue, publishing."
requires-python = ">=3.12,<3.13"
dependencies = [
    "proof3d-pipeline[s3]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proof3d_api"]
